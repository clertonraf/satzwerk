services:

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    # Connection budget sized for (backend replicas x R2DBC pool max-size) + headroom.
    # The default 2 x 15 backend pool budget reserves 30 of the 150 available connections.
    # See docs/adr/0005-postgres-connection-budget.md for the full rationale.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-150}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"]
    environment:
      POSTGRES_DB: ${DB_NAME:-satzwerk}
      POSTGRES_USER: ${DB_USER:-satzwerk}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-satzwerk} -d ${DB_NAME:-satzwerk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    # v3.3's Docker provider hardcodes an old (1.24) Docker API client version;
    # Docker Engine 29+ raised its minimum supported API version to 1.40 and
    # rejects it outright ("client version 1.24 is too old"), breaking all
    # container discovery. Fixed upstream in v3.6.1 (negotiates dynamically).
    # See https://github.com/traefik/traefik/issues/12270.
    image: traefik:v3.6
    platform: linux/arm64
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Internal-only metrics entrypoint. No host port is published in this
      # production-style compose file, so only containers on the same Docker
      # network can reach traefik:8082/actuator/prometheus.
      - "--entrypoints.metrics.address=:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend

  backend:
    image: ghcr.io/clertonraf/satzwerk-backend:latest
    platform: linux/arm64
    restart: unless-stopped
    # Replicas are load-balanced by Traefik's Docker provider, which continuously
    # discovers container IPs and round-robins across all healthy replicas. Do not
    # route to this service directly (e.g. nginx `proxy_pass http://backend:8080`) —
    # plain Docker DNS resolution is cached and does not rebalance across replicas.
    deploy:
      # The shipped default matches the documented 2 vCPU host baseline.
      # See docs/capacity-baseline.md before opting into 3 replicas on larger hosts.
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        # Keep memory.limit in sync with the -Xmx/-XX:MaxMetaspaceSize flags
        # baked into backend/Dockerfile (JAVA_OPTS) — the JVM needs headroom
        # above -Xmx for thread stacks, direct/native buffers, and metaspace.
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-768M}
        reservations:
          cpus: "${BACKEND_CPU_RESERVATION:-0.5}"
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      # #327 fail-fast guardrail: the 3-replica write-saturation study stayed
      # error-free at 250 VUs (~153 req/s) and first failed at 500 VUs, so cap
      # sustained ingress well below that ceiling and keep the burst aligned to
      # the shipped 2-replica pool budget (2 × 15 = 30 connections).
      - "traefik.http.routers.backend.middlewares=backend-ratelimit@docker"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend-metrics.rule=Path(`/actuator/prometheus`)"
      - "traefik.http.routers.backend-metrics.entrypoints=metrics"
      - "traefik.http.routers.backend-metrics.service=backend"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=80"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.sourcecriterion.requesthost=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-satzwerk}
      DB_USER: ${DB_USER:-satzwerk}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      R2DBC_POOL_MAX_SIZE: ${R2DBC_POOL_MAX_SIZE:-15}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/backend || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/clertonraf/satzwerk-frontend:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
      - traefik

  satzwerk-parser:
    image: ghcr.io/clertonraf/satzwerk-parser:latest
    platform: linux/arm64
    restart: unless-stopped
    # Required per the satzwerk-parser README — the service refuses to start
    # without CONNECTION_SESSION_SECRET (min 32 chars). This was previously
    # undeclared here, so the service could only work if started/managed
    # outside this compose file with the var set some other way.
    environment:
      CONNECTION_SESSION_SECRET: ${CONNECTION_SESSION_SECRET}
      CONNECTION_SESSION_TTL_SECONDS: ${CONNECTION_SESSION_TTL_SECONDS:-900}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || curl -sf http://localhost:8080/actuator/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
