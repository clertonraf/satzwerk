groups:
  - name: satzwerk-r2dbc-pool
    rules:
      - alert: R2DBCPoolPendingSustained
        expr: >-
          sum_over_time((r2dbc_pool_pending_connections > bool 0)[5m:15s]) >= 6
        labels:
          severity: warning
        annotations:
          summary: R2DBC connection requests are waiting on the pool
          description: >-
            The load-balanced pool scrape has reported pending connection
            requests in at least 6 samples across the last 5 minutes. Issue
            #309 showed sustained waiters are the earliest real-time signal
            that the configured pool is saturated. Check request latency,
            backend error rate, and current database load before user-facing
            failures increase.
      - alert: R2DBCPoolNearSaturation
        expr: >-
          sum_over_time((
            (
              r2dbc_pool_acquired_connections
              / clamp_min(r2dbc_pool_max_allocated_connections, 1)
            ) > bool 0.9
          )[5m:15s]) >= 6
        labels:
          severity: critical
        annotations:
          summary: R2DBC connection pool is above 90% utilization
          description: >-
            The load-balanced pool scrape has reported >90% utilization in at
            least 6 samples across the last 5 minutes. This is the
            pre-exhaustion signal that led to pending waiters during the #309
            write-saturation test. Confirm whether traffic is expected, then
            scale capacity or reduce the workload before connection
            acquisition starts failing.
