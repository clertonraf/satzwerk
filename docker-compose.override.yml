# Local dev overrides — not committed with secrets
services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      KRAFTLOGPARSER_URL: http://kraftlogparser:8080

  kraftlogparser:
    ports:
      - "8084:8080"

  frontend:
    ports:
      - "5174:80"
    labels:
      - "traefik.enable=false"

  traefik:
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8081:8080"  # Traefik dashboard on 8081
