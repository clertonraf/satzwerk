spring:
  application:
    name: satzwerk-api
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:satzwerk}
    username: ${DB_USER:satzwerk}
    password: ${DB_PASSWORD:satzwerk}
    pool:
      enabled: true
      # max-size is deliberately capped per instance: with the default 3 backend replicas,
      # a pool size of 15 reserves at most 45 Postgres connections, leaving headroom under
      # the shared 150-connection budget for Flyway, health checks, and other clients.
      # Raise this only in lockstep with the replica count and Postgres connection budget.
      initial-size: ${R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${R2DBC_POOL_MAX_SIZE:15}
      max-idle-time: ${R2DBC_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${R2DBC_POOL_MAX_LIFE_TIME:60m}
      max-acquire-time: ${R2DBC_POOL_MAX_ACQUIRE_TIME:3s}
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:satzwerk}
    user: ${DB_USER:satzwerk}
    password: ${DB_PASSWORD:satzwerk}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  security:
    user:
      name: disabled

management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
    prometheus:
      access: read-only

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

satzwerk-parser:
  url: ${SATZWERK_PARSER_URL:http://satzwerk-parser:8080}

satzwerk:
  cache:
    enabled: ${CACHE_ENABLED:true}
