spring:
  application:
    name: satzwerk-api
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:satzwerk}
    username: ${DB_USER:satzwerk}
    password: ${DB_PASSWORD:satzwerk}
    pool:
      enabled: true
      # max-size is deliberately small per instance: Postgres max_connections is a shared,
      # finite budget across all backend replicas (see issue #284 / docs/adr for the sizing
      # rationale). Raise this only in lockstep with the Postgres connection budget.
      initial-size: ${R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: ${R2DBC_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${R2DBC_POOL_MAX_LIFE_TIME:60m}
      max-acquire-time: ${R2DBC_POOL_MAX_ACQUIRE_TIME:3s}
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:satzwerk}
    user: ${DB_USER:satzwerk}
    password: ${DB_PASSWORD:satzwerk}
  security:
    user:
      name: disabled

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

satzwerk-parser:
  url: ${SATZWERK_PARSER_URL:http://satzwerk-parser:8080}
