name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Detect which parts of the monorepo changed so downstream jobs can be
  # skipped when they are not affected.  On workflow_dispatch (no diff
  # available) every filter defaults to 'true' so a manual run always
  # builds everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Lint (ktlint)
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon
      - name: Lint (detekt)
        working-directory: backend
        run: ./gradlew detekt --no-daemon
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  publish:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Run when:
    #   • triggered by a push or manual dispatch to main
    #   • neither backend nor frontend failed
    #   • at least one of them actually built (not both skipped — e.g. docs-only change)
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: patch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ────────────────────────────────────────────────────
      - name: Download backend JAR
        if: needs.backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/
      - name: Docker metadata — backend
        id: meta_backend
        if: needs.backend.result == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/clertonraf/satzwerk-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.new_version }},enable=${{ steps.version.outputs.new_version != '' }}
      - name: Build and push backend
        if: needs.backend.result == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.publish
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Frontend image ───────────────────────────────────────────────────
      - name: Download frontend dist
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Docker metadata — frontend
        id: meta_frontend
        if: needs.frontend.result == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/clertonraf/satzwerk-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.new_version }},enable=${{ steps.version.outputs.new_version != '' }}
      - name: Build and push frontend
        if: needs.frontend.result == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.publish
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.new_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture previous tag
        id: prev_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
      - name: Create Git tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.publish.outputs.new_version }}
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ needs.publish.outputs.new_tag }}
          PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$NEW_TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' > /tmp/release_notes.md
          else
            gh api repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$NEW_TAG" \
              --jq '.body' > /tmp/release_notes.md
          fi
      - name: Update CHANGELOG.md
        env:
          NEW_TAG: ${{ needs.publish.outputs.new_tag }}
        run: |
          NOTES=$(cat /tmp/release_notes.md)
          HEADER="## ${NEW_TAG} ($(date +%Y-%m-%d))"
          if [ -f CHANGELOG.md ]; then
            printf '%s\n\n%s\n\n---\n\n' "$HEADER" "$NOTES" | cat - CHANGELOG.md > /tmp/cl.tmp
            mv /tmp/cl.tmp CHANGELOG.md
          else
            printf '# Changelog\n\n%s\n\n%s\n' "$HEADER" "$NOTES" > CHANGELOG.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${NEW_TAG} [skip ci]" || echo "Nothing to commit"
          git push
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish.outputs.new_tag }}
          name: Release ${{ needs.publish.outputs.new_tag }}
          body_path: /tmp/release_notes.md

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: [publish, release]
    if: always() && needs.publish.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    steps:
      - name: Redeploy stack on Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: |
          set -euo pipefail

          # Read-only calls: retry on transient connection errors only (not on
          # HTTP errors — a 4xx here means misconfiguration and must not loop).
          CURL_GET="curl -fsSL --max-time 30 --retry 3 --retry-delay 10 --retry-connrefused"

          ENDPOINT_ID=$(${CURL_GET} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/endpoints" \
            | jq '.[] | select(.Name == "princess-celestia") | .Id')

          if [ -z "${ENDPOINT_ID}" ]; then
            echo "Error: Portainer environment 'princess-celestia' not found." >&2
            exit 1
          fi

          STACK_ID=$(${CURL_GET} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/stacks" \
            | jq ".[] | select(.Name == \"satzwerk\" and .EndpointId == ${ENDPOINT_ID}) | .Id")

          if [ -z "${STACK_ID}" ]; then
            echo "Error: Portainer stack 'satzwerk' not found on environment ${ENDPOINT_ID}." >&2
            exit 1
          fi

          STACK_FILE=$(${CURL_GET} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}/file" \
            | jq -r '.StackFileContent')

          PAYLOAD=$(jq -n \
            --arg content "${STACK_FILE}" \
            '{"pullImage": true, "prune": false, "stackFileContent": $content}')

          # Trigger the redeploy.  Portainer's stack-update call is synchronous
          # and blocks while Docker pulls the new arm64 images (~2-3 min).
          # A reverse proxy sitting in front of Portainer typically times out
          # after ~90 s and returns HTTP 504, even though Portainer keeps
          # pulling in the background.
          #
          # We therefore:
          #   • do NOT use --retry-all-errors — retrying a 504 would trigger
          #     duplicate concurrent deployments on the host.
          #   • treat 504 and curl-timeout (000) as "pull in progress, not failed".
          #   • treat 4xx as a hard error (bad config / auth).
          #   • poll the stack's Status field until it becomes active (1).
          echo "Triggering stack redeploy..."
          set +e
          curl -s \
            -o /tmp/portainer_deploy.json \
            -w "%{http_code}" \
            --max-time 180 \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            > /tmp/portainer_http_code.txt 2>/tmp/portainer_curl_err.txt
          CURL_EXIT=$?
          set -e

          HTTP_CODE=$(cat /tmp/portainer_http_code.txt 2>/dev/null || echo "000")
          [ -z "${HTTP_CODE}" ] && HTTP_CODE="000"

          case "${HTTP_CODE}" in
            200|202)
              echo "Portainer completed the redeploy synchronously (HTTP ${HTTP_CODE})."
              jq -r '"Stack id=\(.Id) status=\(.Status)"' /tmp/portainer_deploy.json 2>/dev/null || true
              exit 0
              ;;
            504|000)
              # 504 = proxy timed out while Portainer pulls the image.
              # 000 = curl itself timed out (--max-time). Either way, Portainer
              # is still working — proceed to the status poll below.
              echo "Proxy/curl timeout (HTTP ${HTTP_CODE}, curl exit ${CURL_EXIT}) — Portainer is pulling the image. Polling for completion..."
              ;;
            4[0-9][0-9])
              echo "Client error HTTP ${HTTP_CODE} — check PORTAINER_URL and PORTAINER_TOKEN." >&2
              cat /tmp/portainer_deploy.json >&2
              exit 1
              ;;
            *)
              echo "Unexpected HTTP ${HTTP_CODE} (curl exit ${CURL_EXIT})." >&2
              cat /tmp/portainer_deploy.json >&2
              cat /tmp/portainer_curl_err.txt >&2
              exit 1
              ;;
          esac

          # Poll GET /api/stacks/{id} until Status == 1 (active) or we time out.
          # Portainer sets Status=1 once all containers in the stack are running.
          MAX_WAIT=300
          INTERVAL=20
          ELAPSED=0

          while [ "${ELAPSED}" -lt "${MAX_WAIT}" ]; do
            sleep "${INTERVAL}"
            ELAPSED=$((ELAPSED + INTERVAL))

            STACK_STATUS=$(curl -fsSL --max-time 15 \
              -H "X-API-Key: ${PORTAINER_TOKEN}" \
              "${PORTAINER_URL}/api/stacks/${STACK_ID}" \
              2>/dev/null | jq -r '.Status' 2>/dev/null || echo "unreachable")

            echo "  [${ELAPSED}s/${MAX_WAIT}s] Stack status: ${STACK_STATUS}"

            if [ "${STACK_STATUS}" = "1" ]; then
              echo "Stack is active. Deployment succeeded."
              exit 0
            fi
          done

          echo "Stack did not become active within ${MAX_WAIT}s." >&2
          exit 1
