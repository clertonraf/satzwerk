name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Lint (ktlint)
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon
      - name: Lint (detekt)
        working-directory: backend
        run: ./gradlew detekt --no-daemon
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test
      - name: Build Docker image
        working-directory: backend
        run: docker build -t satzwerk-api:ci .

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Build Docker image
        working-directory: frontend
        run: docker build -t satzwerk-frontend:ci .

  publish:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/clertonraf/satzwerk-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/clertonraf/satzwerk-frontend:latest

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Redeploy stack on Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: |
          set -euo pipefail

          CURL="curl -fsSL --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors"

          ENDPOINT_ID=$(${CURL} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/endpoints" \
            | jq '.[] | select(.Name == "princess-celestia") | .Id')

          if [ -z "${ENDPOINT_ID}" ]; then
            echo "Error: Portainer environment 'princess-celestia' not found." >&2
            exit 1
          fi

          STACK_ID=$(${CURL} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/stacks" \
            | jq ".[] | select(.Name == \"satzwerk\" and .EndpointId == ${ENDPOINT_ID}) | .Id")

          if [ -z "${STACK_ID}" ]; then
            echo "Error: Portainer stack 'satzwerk' not found on environment ${ENDPOINT_ID}." >&2
            exit 1
          fi

          STACK_FILE=$(${CURL} \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}/file" \
            | jq -r '.StackFileContent')

          PAYLOAD=$(jq -n \
            --arg content "${STACK_FILE}" \
            '{"pullImage": true, "prune": false, "stackFileContent": $content}')

          curl -fsSL --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            | jq '.Id, .Status'

          echo "Deployment triggered successfully."
