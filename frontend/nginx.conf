server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Traefik, which load-balances across all healthy backend
    # replicas via its Docker provider (service discovery refreshes on scale
    # events). Proxying directly to `backend:8080` would only ever reach one
    # replica's IP, since nginx resolves and caches the Docker DNS answer once.
    location /api/ {
        proxy_pass http://traefik:80;
        proxy_set_header Host $host;
        # #327 normalizes Traefik's aggregate rate-limit bucket so callers
        # cannot bypass the shared `/api` guardrail by varying Host headers.
        proxy_set_header X-RateLimit-Bucket backend-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
